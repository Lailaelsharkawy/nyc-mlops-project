data:
  raw_path: data/raw/yellow_tripdata_2015-01.csv
  processed_path: data/processed/cleaned.csv
  split_path: data/splits/

target: total_amount

split:
  test_size: 0.2
  random_state: 42

features:
  numeric:
    - passenger_count
    - trip_distance
    - fare_amount
    - tip_amount
    - tolls_amount

  categorical:
  - VendorID
  - payment_type

selection:
  k_best: 8