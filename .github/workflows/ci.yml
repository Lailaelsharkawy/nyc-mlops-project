name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
         pip install -r requirements.txt

      - name: Download Dataset
        run: |
         python download_data.py

      - name: Run DVC Pipeline
        run: |
         dvc repro

      - name: Run tests
        run: |
         pytest